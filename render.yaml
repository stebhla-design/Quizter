services:
  - type: web
    name: quizter-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # --- Email (password reset) via Resend HTTP API ---
      # Uses HTTPS (port 443), so it works on Render's free plan (SMTP is blocked).
      # Set the API key value in the Render dashboard (sync: false).
      - key: RESEND_API_KEY
        sync: false
      # From address. Use "onboarding@resend.dev" for testing, or a verified
      # domain sender like "Quizter <no-reply@yourdomain.com>" for production.
      - key: EMAIL_FROM
        sync: false
      # Frontend URL used to build the reset link in the email.
      - key: FRONTEND_URL
        fromService:
          type: web
          name: quizter-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: quizter-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: quizter-backend
          envVarKey: RENDER_EXTERNAL_URL
