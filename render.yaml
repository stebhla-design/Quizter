services:
  - type: web
    name: quizter-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # --- Email (password reset) ---
      # Secrets: set their values in the Render dashboard (sync: false).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      # Frontend URL used to build the reset link in the email.
      - key: FRONTEND_URL
        fromService:
          type: web
          name: quizter-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: quizter-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: quizter-backend
          envVarKey: RENDER_EXTERNAL_URL
